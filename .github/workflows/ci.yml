name: CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'clob/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'clob/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S clob -B clob/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build clob/build --parallel

      - name: Test
        run: ctest --test-dir clob/build --output-on-failure
